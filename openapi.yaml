  /api/v1/parcelles/{id}/mesures/agregats:
    get:
      tags:
      - Mesures
      summary: Agréger les mesures valides sur 1 à 7 jours
      operationId: agregerMesures
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ParcelleId'
      - name: intervalle
        in: query
        schema:
          type: string
