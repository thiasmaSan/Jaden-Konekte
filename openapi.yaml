        '500':
          $ref: '#/components/responses/ErreurInterne'
        '503':
          $ref: '#/components/responses/Indisponible'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ParcelleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    RoleInsuffisant:
      description: Le rôle dans cette exploitation ne permet pas cette opération
      content: *id001
    CodeParcelleExistant:
      description: Code de parcelle déjà utilisé dans cette exploitation
      content: *id001
    DonneesInvalides:
      description: Données invalides
      content: *id001
    NonAutorise:
      description: Authentification requise ou invalide
      content: *id001
    Introuvable:
      description: Ressource introuvable ou inaccessible
      content: *id001
    Indisponible:
      description: Base de données indisponible
      content: *id001
    ErreurInterne:
      description: Erreur interne
      content: *id001

  schemas:
    Body_creerDiagnostic:
      properties:
        image:
          type: string
          format: binary
          title: Image
      type: object
      required:
      - image
      title: Body_creerDiagnostic
    Diagnostic:
      properties:
        id:
          type: integer
          title: Id
        parcelle:
          type: integer
          title: Parcelle
        auteur:
          anyOf:
          - type: integer
          - type: 'null'
          title: Auteur
        image_url:
          type: string
          title: Image Url
        statut:
          type: string
          title: Statut
        classe:
          anyOf:
          - type: string
          - type: 'null'
          title: Classe
        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
        modele:
          anyOf:
          - type: string
          - type: 'null'
          title: Modele
        confirme:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Confirme
        cree_le:
          type: string
          format: date-time
          title: Cree Le
        termine_le:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Termine Le
      type: object
      required:
      - id
      - parcelle
      - auteur
      - image_url
      - statut
      - classe
      - score
      - modele
      - confirme
      - cree_le
      - termine_le
      title: Diagnostic
    ConfigurationArrosage:
      properties:
        active:
          type: boolean
          title: Active
          default: false
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        seuil:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Seuil
        duree_s:
          type: integer
          maximum: 3600.0
          minimum: 10.0
          title: Duree S
        delai_min_s:
          type: integer
          maximum: 604800.0
          minimum: 600.0
          title: Delai Min S
      type: object
      required:
      - latitude
      - longitude
      - seuil
      - duree_s
      - delai_min_s
      title: ConfigurationArrosage
    QuestionAgronome:
      properties:
        question:
          type: string
          maxLength: 1000
          minLength: 3
          title: Question
      type: object
      required:
      - question
      title: QuestionAgronome
    NouvelleCommandeVanne:
      properties:
        action:
          type: string
          enum:
          - ouvrir
          - fermer
          title: Action
        duree_s:
          anyOf:
          - type: integer
            maximum: 3600.0
            minimum: 10.0
          - type: 'null'
          title: Duree S
      additionalProperties: false
      type: object
      required:
      - action
      title: NouvelleCommandeVanne
    
    RecommandationIrrigation:
      properties:
        parcelle_id:
          type: integer
          title: Parcelle Id
        humidite_sol:
          anyOf:
          - type: number
          - type: 'null'
          title: Humidite Sol
        seuil_sec:
          anyOf:
          - type: number
          - type: 'null'
          title: Seuil Sec
        pluie_prevue_mm:
          anyOf:
          - type: number
          - type: 'null'
          title: Pluie Prevue Mm
        temperature_moyenne_c:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature Moyenne C
        decision:
          type: string
          enum:
          - arroser
          - attendre
          - donnees_insuffisantes
          title: Decision
        raison:
          type: string
          title: Raison
        mode:
          type: string
          const: simulation
          title: Mode
          default: simulation
        source_meteo:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Meteo
      type: object
      required:
      - parcelle_id
      - humidite_sol
      - seuil_sec
      - pluie_prevue_mm
      - temperature_moyenne_c
      - decision
      - raison
      title: RecommandationIrrigation
    CommandeVanne:
      properties:
        id:
          type: string
          title: Id
        equipement:
          type: integer
          title: Equipement
        action:
